name: Enforce Contact Number User Reference Once

on:
  push:
    paths:
      - '.github/workflows/enforce-contact-number-user-reference-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make contact number the primary user identifier
        run: |
          python - <<'PY'
          from pathlib import Path

          # Admin Users: phone is the canonical displayed/reference identifier.
          p=Path('app/admin/users/page.tsx')
          s=p.read_text()
          anchor=" function date(value?:string|null){if(!value)return 'Not available';const d=new Date(value);return Number.isNaN(d.getTime())?'Not available':d.toLocaleString();}\n"
          if "function userRef(u:UserRow)" not in s:
            if anchor not in s: raise SystemExit('Admin Users date helper anchor not found')
            s=s.replace(anchor,anchor+" function userRef(u:UserRow){return u.phone_number?.trim()||'Contact number missing';}\n",1)
          replacements={
            "${row.full_name||row.email||'user'}":"${userRef(row)}",
            "${row.full_name||row.email||'User'}":"${userRef(row)}",
            "const name=row.full_name||row.email||'User';":"const name=userRef(row);",
            "const name=row.full_name||row.email||'this user';":"const name=userRef(row);",
            "<h2>{u.full_name||'Unnamed user'}</h2>":"<h2>{userRef(u)}</h2>",
            "placeholder=\"Name, email, phone, role, right, privilege, status or user ID\"":"placeholder=\"Contact number, email, role, right, privilege, status or user ID\"",
            "<strong>{u.full_name||u.email||'Unnamed user'}</strong>":"<strong>{userRef(u)}</strong>",
            "<strong>{u.full_name||'Unnamed user'}</strong>":"<strong>{userRef(u)}</strong>",
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          p.write_text(s)

          # Admin Providers: merge phone from Admin Users API and display it first.
          p=Path('app/admin/providers/page.tsx')
          s=p.read_text()
          s=s.replace("const ADMIN_URL='https://yzlhlilxiszefneshatm.supabase.co/functions/v1/admin-operations';", "const ADMIN_URL='https://yzlhlilxiszefneshatm.supabase.co/functions/v1/admin-operations';\nconst ADMIN_USERS_URL='https://yzlhlilxiszefneshatm.supabase.co/functions/v1/admin-users';")
          s=s.replace("type ProviderRow={user_id:string;email?:string|null;full_name?:string|null;provider_approved:boolean;created_at:string};", "type ProviderRow={user_id:string;email?:string|null;full_name?:string|null;phone_number?:string|null;provider_approved:boolean;created_at:string};")
          old=" async function load(){try{const payload=await callAdmin({action:'dashboard'});if(!payload)return;setProviders(payload.providers||[]);setMessage('Provider list loaded.');}catch(error){setMessage(error instanceof Error?error.message:'Unable to load providers.');}}"
          new=" async function load(){try{const t=await jwt();if(!t)return;const [payload,userResponse]=await Promise.all([callAdmin({action:'dashboard'}),fetch(ADMIN_USERS_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${t}`},body:'{}'})]);if(!payload)return;const userPayload=await userResponse.json().catch(()=>({}));const phoneMap=new Map((userPayload.users||[]).map((u:any)=>[u.user_id,u.phone_number||null]));setProviders((payload.providers||[]).map((p:ProviderRow)=>({...p,phone_number:phoneMap.get(p.user_id)||null})));setMessage('Provider list loaded.');}catch(error){setMessage(error instanceof Error?error.message:'Unable to load providers.');}}"
          if old not in s: raise SystemExit('Admin Providers load function not found')
          s=s.replace(old,new,1)
          s=s.replace("setMessage(`${row.full_name||row.email||'Provider'} ${approved?'approved':'disabled'}.`);", "setMessage(`${row.phone_number?.trim()||'Contact number missing'} ${approved?'approved':'disabled'}.`);")
          s=s.replace("<strong>{p.full_name||'Unnamed provider'}</strong><div className=\"muted\">{p.email||'No email'}</div>", "<strong>{p.phone_number?.trim()||'Contact number missing'}</strong><div className=\"muted\">{p.email||'No email'}</div>")
          p.write_text(s)

          # Provider detail: fetch phone and use it as the record heading.
          p=Path('app/admin/providers/[userId]/page.tsx')
          s=p.read_text()
          s=s.replace("const ADMIN_URL='https://yzlhlilxiszefneshatm.supabase.co/functions/v1/admin-operations';", "const ADMIN_URL='https://yzlhlilxiszefneshatm.supabase.co/functions/v1/admin-operations';\nconst ADMIN_USERS_URL='https://yzlhlilxiszefneshatm.supabase.co/functions/v1/admin-users';")
          s=s.replace("type Account={user_id:string;email?:string|null;full_name?:string|null;provider_approved:boolean;created_at:string;updated_at:string};", "type Account={user_id:string;email?:string|null;full_name?:string|null;phone_number?:string|null;provider_approved:boolean;created_at:string;updated_at:string};")
          old="  async function refreshDetail(){\n    const d=await call(ADMIN_URL,{action:'provider_detail',providerUserId:userId});\n    setDetail(d as Detail);\n  }"
          new="  async function refreshDetail(){\n    const [d,usersPayload]=await Promise.all([call(ADMIN_URL,{action:'provider_detail',providerUserId:userId}),call(ADMIN_USERS_URL,{})]);\n    const userRow=(usersPayload?.users||[]).find((u:any)=>u.user_id===userId);\n    setDetail({...d,account:{...d.account,phone_number:userRow?.phone_number||null}} as Detail);\n  }"
          if old not in s: raise SystemExit('Provider detail refresh function not found')
          s=s.replace(old,new,1)
          s=s.replace("<h1>{p?.public_name||detail.account.full_name||'Unnamed provider'}</h1>", "<h1>{detail.account.phone_number?.trim()||'Contact number missing'}</h1>")
          p.write_text(s)
          PY
      - name: Commit contact-number reference rule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/users/page.tsx app/admin/providers/page.tsx app/admin/providers/[userId]/page.tsx
          git commit -m "Use contact number as primary user reference"
          git push
