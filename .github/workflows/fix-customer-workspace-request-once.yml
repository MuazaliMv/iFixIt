name: Fix Customer Workspace Request Once

on:
  push:
    paths:
      - '.github/workflows/fix-customer-workspace-request-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make selected Customer workspace authoritative for requests
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/CustomerPortal.tsx')
          s = p.read_text()

          old_helper = "function normalizeRequestStatus(status:unknown){return String(status||'').toUpperCase()==='NEW'?'PENDING':String(status||'PENDING').toUpperCase();}\n"
          new_helper = old_helper + "function selectedWorkspace(){try{return localStorage.getItem('fixit:app-mode')||localStorage.getItem('fixit:mobile-nav-role')||'customer';}catch{return 'customer';}}\n"
          if "function selectedWorkspace()" not in s:
              if old_helper not in s:
                  raise SystemExit('normalize helper not found')
              s = s.replace(old_helper, new_helper, 1)

          s = s.replace("if(p?.role==='CUSTOMER')await loadProfileStatus(data.session.access_token);", "await loadProfileStatus(data.session.access_token);")
          s = s.replace("if(p?.role==='CUSTOMER')await loadProfileStatus(session.access_token);", "await loadProfileStatus(session.access_token);")

          old_validate = "function validateStep(current:Step){if(!profile)return'Please sign in first.';if(profileStatus&&!profileStatus.can_request)return'Complete the required profile fields first.';"
          new_validate = "function validateStep(current:Step){if(!profile)return'Please sign in first.';if(selectedWorkspace()!=='customer')return'Switch to Customer mode to create a request.';if(profileStatus&&!profileStatus.can_request)return'Complete the required profile fields first.';"
          if old_validate not in s:
              raise SystemExit('validateStep pattern not found')
          s = s.replace(old_validate, new_validate, 1)

          # Permanently remove any legacy permanent-role request restriction if it reappears.
          s = s.replace("if(profile.role!=='CUSTOMER')return'Use a Customer account to create a request.';", "")

          p.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-customer-workspace-request-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/CustomerPortal.tsx .github/workflows/fix-customer-workspace-request-once.yml
          git commit -m "Use selected Customer workspace for request permissions"
          git push
