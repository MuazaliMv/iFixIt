name: Remove duplicate request location step

on:
  push:
    paths:
      - '.github/workflows/remove-duplicate-request-location-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update customer request flow and landing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/CustomerPortal.tsx')
          s = p.read_text()
          original = s

          s = s.replace("import { useAutoLocation } from '../lib/useAutoLocation';\n", "")
          s = s.replace(
            "type Profile={role:'CUSTOMER'|'PROVIDER'|'ADMIN';full_name?:string|null;provider_approved?:boolean};",
            "type Profile={role:'CUSTOMER'|'PROVIDER'|'ADMIN';full_name?:string|null;provider_approved?:boolean;primaryAddress?:{line1?:string|null;line2?:string|null;city?:string|null;ward?:string|null;stateRegion?:string|null;postalCode?:string|null;country?:string|null}|null};"
          )
          s = s.replace(" const{resolving,resolved,error:locationError,resolveCurrentLocation}=useAutoLocation();\n", "")
          s = s.replace(
            " const islandOptions=useMemo(()=>islands.filter(i=>i.atoll_id===atollId),[islands,atollId]);const unitOptions=useMemo(()=>units.filter(u=>u.island_id===islandId),[units,islandId]);const selectedCategory=useMemo(()=>serviceCategories.find(s=>s.code===serviceCode)||null,[serviceCategories,serviceCode]);const selectedIsland=useMemo(()=>islands.find(i=>i.id===islandId)||null,[islands,islandId]);const selectedUnit=useMemo(()=>units.find(u=>u.id===unitId)||null,[units,unitId]);const photoUrls=useMemo(()=>photos.map(file=>URL.createObjectURL(file)),[photos]);",
            " const selectedCategory=useMemo(()=>serviceCategories.find(s=>s.code===serviceCode)||null,[serviceCategories,serviceCode]);const selectedIsland=useMemo(()=>islands.find(i=>i.id===islandId)||null,[islands,islandId]);const selectedUnit=useMemo(()=>units.find(u=>u.id===unitId)||null,[units,unitId]);const photoUrls=useMemo(()=>photos.map(file=>URL.createObjectURL(file)),[photos]);"
          )

          anchor = " useEffect(()=>()=>{photoUrls.forEach(url=>URL.revokeObjectURL(url));},[photoUrls]);\n"
          effect = """ useEffect(()=>()=>{photoUrls.forEach(url=>URL.revokeObjectURL(url));},[photoUrls]);
 useEffect(()=>{
  const address=profile?.primaryAddress;if(!address?.city||!address?.stateRegion||!atolls.length||!islands.length)return;
  const atoll=atolls.find(a=>a.display_name===address.stateRegion||a.code===address.stateRegion);if(!atoll)return;
  const island=islands.find(i=>i.atoll_id===atoll.id&&i.display_name===address.city);if(!island)return;
  const unit=address.ward?units.find(u=>u.island_id===island.id&&u.display_name===address.ward):null;
  setAtollId(atoll.id);setIslandId(island.id);setUnitId(unit?.id||'');
 },[profile,atolls,islands,units]);
"""
          if anchor not in s:
            raise SystemExit('photo effect anchor not found')
          s = s.replace(anchor, effect, 1)

          s, n = re.subn(r"\n async function detectLocation\(\)\{.*?\}\n async function signOut", "\n async function signOut", s, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('detectLocation block not found')

          s = s.replace("if(current>=2&&!islandId)return'Choose the service island or city.';", "if(current>=2&&!islandId)return'Add an Island / City to your profile before continuing.';")

          old_next = "function next(){const error=validateStep(step,true);if(error){setMessage(error);return;}setMessage('');setStep(Math.min(5,step+1) as Step);window.scrollTo({top:0,behavior:'smooth'});}\n function back(){if(step===1){setMode('home');setMessage('');return;}setStep((step-1) as Step);setMessage('');window.scrollTo({top:0,behavior:'smooth'});}"
          new_next = "function next(){const error=validateStep(step,true);if(error){setMessage(error);return;}setMessage('');setStep((step===1?3:Math.min(5,step+1)) as Step);window.scrollTo({top:0,behavior:'smooth'});}\n function back(){if(step===1){setMode('home');setMessage('');return;}if(step===3){setStep(1);setMessage('');window.scrollTo({top:0,behavior:'smooth'});return;}setStep((step-1) as Step);setMessage('');window.scrollTo({top:0,behavior:'smooth'});}"
          if old_next not in s:
            raise SystemExit('wizard navigation anchor not found')
          s = s.replace(old_next, new_next, 1)

          start = s.find("   {step===2?")
          end = s.find("   {step===3?", start)
          if start == -1 or end == -1:
            raise SystemExit('step 2 location block not found')
          s = s[:start] + s[end:]

          old_top = "<div className=\"c3WizardTop\"><div className=\"c3StepDots\">{[1,2,3,4,5].map(n=><span key={n} className={`c3StepDot ${n===step?'active':n<step?'done':''}`}/>)}</div><span className=\"c3Status\">{t('step')} {step} {t('of')} 5</span></div>"
          new_top = "<div className=\"c3WizardTop\"><div className=\"c3StepDots\">{([1,3,4,5] as const).map(n=><span key={n} className={`c3StepDot ${n===step?'active':n<step?'done':''}`}/>)}</div><span className=\"c3Status\">{t('step')} {step===1?1:step-1} {t('of')} 4</span></div>"
          if old_top not in s:
            raise SystemExit('wizard top anchor not found')
          s = s.replace(old_top, new_top, 1)

          old_step1 = "{step===1?<><div className=\"c3Question\"><small>{t('service')}</small><h1>{t('whatHelp')}</h1><p>{t('chooseService')}</p></div><div className=\"c3ServiceGrid\" style={{marginTop:20}}>{serviceCategories.map(item=><button className={`c3ServiceTile ${serviceCode===item.code?'selected':''}`} key={item.id} onClick={()=>setServiceCode(item.code)}><ServiceIcon name={item.name}/><strong>{item.name}</strong><span>{serviceCode===item.code?t('selected'):t('choose')}</span></button>)}</div></>:null}"
          new_step1 = "{step===1?<><div className=\"c3Question\"><small>{t('service')}</small><h1>{t('whatHelp')}</h1><p>{t('chooseService')}</p></div><div className=\"c3ServiceGrid\" style={{marginTop:20}}>{serviceCategories.map(item=><button className={`c3ServiceTile ${serviceCode===item.code?'selected':''}`} key={item.id} onClick={()=>setServiceCode(item.code)}><ServiceIcon name={item.name}/><strong>{item.name}</strong><span>{serviceCode===item.code?t('selected'):t('choose')}</span></button>)}</div><div className=\"c3Review\" style={{marginTop:20}}><div className=\"c3ReviewRow\"><span>Service location</span><strong>{[profile?.primaryAddress?.line1,profile?.primaryAddress?.line2,profile?.primaryAddress?.city,profile?.primaryAddress?.ward,profile?.primaryAddress?.stateRegion,profile?.primaryAddress?.postalCode].filter(Boolean).join(', ')||'Add your service address in Profile'}</strong></div></div><div style={{marginTop:12}}><a className=\"c3Secondary\" href=\"/profile#service-addresses\">Change saved address</a></div></>:null}"
          if old_step1 not in s:
            raise SystemExit('step 1 anchor not found')
          s = s.replace(old_step1, new_step1, 1)

          if s == original:
            raise SystemExit('no CustomerPortal changes made')
          p.write_text(s)

          lp = Path('app/page.tsx')
          l = lp.read_text()
          before = l
          card_start = l.find('    <div className="landingHeroCard">')
          card_end = l.find('</div></section>', card_start)
          if card_start == -1 or card_end == -1:
            raise SystemExit('landing request card not found')
          l = l[:card_start] + '</div></section>' + l[card_end+len('</div></section>'):]
          for key in ['start','needs','live','service','chooseService','location','chooseIsland','continue','fast','fastText','choose','chooseText']:
            l = re.sub(r","+key+r":'[^']*'", '', l)
          if l == before:
            raise SystemExit('no landing changes made')
          lp.write_text(l)
          PY
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/CustomerPortal.tsx app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove duplicate request location form"
          git push
