name: Remove Save Draft Once

on:
  push:
    paths:
      - '.github/workflows/remove-save-draft-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove save draft UI from request wizard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/CustomerPortal.tsx')
          s = p.read_text()
          old = '''<div className="c3ActionDock"><div className="c3ActionInner"><button className="c3Secondary" onClick={back}>{step===1?t('cancel'):t('back')}</button>{step<5?<button className="c3Primary" onClick={next}>{t('continue')}</button>:<button className="c3Primary" onClick={()=>void submitRequest()} disabled={submitting||uploading}>{submitting?t('sending'):t('sendRequest')}</button>}</div><button onClick={saveDraft} style={{border:0,background:'transparent',padding:'10px 0 0',fontWeight:800,color:'var(--c3-muted)'}}>{draftSaved?t('draftSaved'):t('saveDraft')}</button></div>'''
          new = '''<div className="c3ActionDock"><div className="c3ActionInner"><button className="c3Secondary" onClick={back}>{step===1?t('cancel'):t('back')}</button>{step<5?<button className="c3Primary" onClick={next}>{t('continue')}</button>:<button className="c3Primary" onClick={()=>void submitRequest()} disabled={submitting||uploading}>{submitting?t('sending'):t('sendRequest')}</button>}</div></div>'''
          if old not in s:
              raise SystemExit('Save draft action block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/CustomerPortal.tsx
          git commit -m "Remove save draft from request wizard"
          git push
