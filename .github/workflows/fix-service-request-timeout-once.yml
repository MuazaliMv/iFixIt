name: Fix service request timeout once

on:
  push:
    branches:
      - fix/service-request-submit-timeout-20260826

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/service-request-submit-timeout-20260826
      - name: Patch request submission timeouts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/CustomerPortal.tsx')
          s=p.read_text()
          anchor="function normalizeRequestStatus(status:unknown){return String(status||'').toUpperCase()==='NEW'?'PENDING':String(status||'PENDING').toUpperCase();}\n"
          helper="""function normalizeRequestStatus(status:unknown){return String(status||'').toUpperCase()==='NEW'?'PENDING':String(status||'PENDING').toUpperCase();}\n\nasync function fetchWithTimeout(input:RequestInfo|URL,init:RequestInit={},timeoutMs=15000){\n const controller=new AbortController();\n const timer=window.setTimeout(()=>controller.abort(),timeoutMs);\n try{return await fetch(input,{...init,signal:controller.signal});}\n catch(error){if(error instanceof DOMException&&error.name==='AbortError')throw new Error('The request timed out. Please check your connection and try again.');throw error;}\n finally{window.clearTimeout(timer);}\n}\n"""
          assert anchor in s
          s=s.replace(anchor,helper,1)
          old_token=" async function token(){const{data}=await supabase.auth.getSession();return data.session?.access_token||'';}"
          new_token=" async function token(){const{data}=await supabase.auth.getSession();const value=data.session?.access_token||'';if(!value)throw new Error('Your login session has expired. Please sign in again.');return value;}"
          assert old_token in s
          s=s.replace(old_token,new_token,1)
          old_upload=" async function uploadPhotos(ticket:string,jwt:string){if(!photos.length)return;setUploading(true);try{for(const file of photos){const form=new FormData();form.append('ticketNumber',ticket);form.append('file',file);const r=await fetch(MEDIA_URL,{method:'POST',headers:{Authorization:`Bearer ${jwt}`},body:form});const p=await r.json();if(!r.ok)throw new Error(p?.error||`Unable to upload ${file.name}`);}}finally{setUploading(false);}}"
          new_upload=" async function uploadPhotos(ticket:string,jwt:string){if(!photos.length)return;setUploading(true);try{for(const file of photos){const form=new FormData();form.append('ticketNumber',ticket);form.append('file',file);const r=await fetchWithTimeout(MEDIA_URL,{method:'POST',headers:{Authorization:`Bearer ${jwt}`},body:form},20000);const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p?.error||`Unable to upload ${file.name}`);}}finally{setUploading(false);}}"
          assert old_upload in s
          s=s.replace(old_upload,new_upload,1)
          old_submit=" async function submitRequest(){const error=validateStep(5);if(error){setMessage(error);return;}setSubmitting(true);setMessage(t('sending'));try{const jwt=await token();const response=await fetch(SUBMIT_REQUEST_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${jwt}`},body:JSON.stringify({serviceCategoryCode:serviceCode,serviceSubcategoryCode:subcategoryCode||null,islandId,locationUnitId:unitId||null,preferredDate:urgency==='SCHEDULE'?preferredDate:null,description:description.trim(),customerNotes:notes.trim()||null,urgency,isOnSiteSameAsCustomer,onSiteContactName:isOnSiteSameAsCustomer?null:onSiteContactName.trim(),onSiteContactPhone:isOnSiteSameAsCustomer?null:onSiteContactPhone.trim(),clientRequestId:crypto.randomUUID()})});const payload=await response.json();if(!response.ok||!payload?.request?.ticket_number)throw new Error(payload?.error||'Unable to submit request');let photoWarning='';try{await uploadPhotos(payload.request.ticket_number,jwt);}catch(e){photoWarning=e instanceof Error?` Photos need retry: ${e.message}`:' Photos need retry.';}const request:LastRequest={id:payload.request.ticket_number,service:payload.request.service_name||selectedCategory?.name||'Service',location:payload.request.service_location_text||selectedIsland?.display_name||'Selected location',status:normalizeRequestStatus(payload.request.status),createdAt:payload.request.created_at||new Date().toISOString()};localStorage.setItem('fixit:last-request',JSON.stringify(request));setLastRequest(request);clearDraft();setMessage(`Request sent.${photoWarning}`);window.location.href=`/requests/${encodeURIComponent(request.id)}`;}catch(e){setMessage(e instanceof Error?e.message:'Unable to submit request.');}finally{setSubmitting(false);}}"
          new_submit=" async function submitRequest(){const error=validateStep(5);if(error){setMessage(error);return;}if(submitting)return;setSubmitting(true);setMessage(t('sending'));try{const jwt=await token();const response=await fetchWithTimeout(SUBMIT_REQUEST_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${jwt}`},body:JSON.stringify({serviceCategoryCode:serviceCode,serviceSubcategoryCode:subcategoryCode||null,islandId,locationUnitId:unitId||null,preferredDate:urgency==='SCHEDULE'?preferredDate:null,description:description.trim(),customerNotes:notes.trim()||null,urgency,isOnSiteSameAsCustomer,onSiteContactName:isOnSiteSameAsCustomer?null:onSiteContactName.trim(),onSiteContactPhone:isOnSiteSameAsCustomer?null:onSiteContactPhone.trim(),clientRequestId:crypto.randomUUID()})},20000);const payload=await response.json().catch(()=>({}));if(!response.ok||!payload?.request?.ticket_number)throw new Error(payload?.error||'Unable to submit request');let photoWarning='';try{await uploadPhotos(payload.request.ticket_number,jwt);}catch(e){photoWarning=e instanceof Error?` Photos need retry: ${e.message}`:' Photos need retry.';}const request:LastRequest={id:payload.request.ticket_number,service:payload.request.service_name||selectedCategory?.name||'Service',location:payload.request.service_location_text||selectedIsland?.display_name||'Selected location',status:normalizeRequestStatus(payload.request.status),createdAt:payload.request.created_at||new Date().toISOString()};localStorage.setItem('fixit:last-request',JSON.stringify(request));setLastRequest(request);clearDraft();setMessage(`Request sent.${photoWarning}`);window.location.assign(`/requests/${encodeURIComponent(request.id)}`);}catch(e){setMessage(e instanceof Error?e.message:'Unable to submit request.');}finally{setSubmitting(false);}}"
          assert old_submit in s
          s=s.replace(old_submit,new_submit,1)
          p.write_text(s)
          PY
      - name: Add regression test
        run: |
          cat > tests/service-request-timeout.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const read=path=>readFile(new URL(`../${path}`,import.meta.url),'utf8');
          test('service request submission cannot remain stuck forever',async()=>{
            const portal=await read('app/CustomerPortal.tsx');
            assert.match(portal,/async function fetchWithTimeout/);
            assert.match(portal,/fetchWithTimeout\(SUBMIT_REQUEST_URL/);
            assert.match(portal,/fetchWithTimeout\(MEDIA_URL/);
            assert.match(portal,/if\(submitting\)return/);
            assert.match(portal,/finally\{setSubmitting\(false\);\}/);
            assert.match(portal,/login session has expired/i);
            assert.match(portal,/response\.json\(\)\.catch/);
          });
          EOF
      - name: Remove one-time workflow and commit patch
        run: |
          rm .github/workflows/fix-service-request-timeout-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/CustomerPortal.tsx tests/service-request-timeout.test.mjs .github/workflows/fix-service-request-timeout-once.yml
          git commit -m "Fix service request submission getting stuck"
          git push origin HEAD:fix/service-request-submit-timeout-20260826
