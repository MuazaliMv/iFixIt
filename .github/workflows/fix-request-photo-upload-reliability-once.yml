name: Fix Request Photo Upload Reliability Once

on:
  push:
    paths:
      - '.github/workflows/fix-request-photo-upload-reliability-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make request photo uploads reliable
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/CustomerPortal.tsx')
          s=p.read_text()
          old=""" async function uploadPhotos(ticket:string,jwt:string){if(!photos.length)return;setUploading(true);try{for(const file of photos){const form=new FormData();form.append('ticketNumber',ticket);form.append('file',file);const r=await fetchWithTimeout(MEDIA_URL,{method:'POST',headers:{Authorization:`Bearer ${jwt}`},body:form},20000);const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p?.error||`Unable to upload ${file.name}`);}}finally{setUploading(false);}}"""
          new=""" async function uploadPhotos(ticket:string,jwt:string){if(!photos.length)return;setUploading(true);try{for(const file of photos){let lastError='';for(let attempt=1;attempt<=3;attempt++){try{const form=new FormData();form.append('ticketNumber',ticket);form.append('file',file,file.name||'photo.jpg');const r=await fetchWithTimeout(MEDIA_URL,{method:'POST',headers:{Authorization:`Bearer ${jwt}`},body:form},25000);const p=await r.json().catch(()=>({}));if(r.ok){lastError='';break;}lastError=p?.error||`Unable to upload ${file.name||'photo'}`;}catch(error){lastError=error instanceof Error?error.message:`Unable to upload ${file.name||'photo'}`;}if(attempt<3)await new Promise(resolve=>window.setTimeout(resolve,500*attempt));}if(lastError)throw new Error(lastError);}}finally{setUploading(false);}}"""
          if old not in s:
              raise SystemExit('uploadPhotos block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit photo upload fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/CustomerPortal.tsx
          git commit -m "Fix request photo upload reliability"
          git push
