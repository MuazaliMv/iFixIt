name: Fix Customer Dual Mode Request Once

on:
  push:
    paths:
      - '.github/workflows/fix-customer-dual-mode-request-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow customer workspace request flow for dual-mode accounts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/CustomerPortal.tsx')
          s = p.read_text()
          old = "if(!profile)return'Please sign in first.';if(profile.role!=='CUSTOMER')return'Use a Customer account to create a request.';if(profileStatus&&!profileStatus.can_request)"
          new = "if(!profile)return'Please sign in first.';if(profileStatus&&!profileStatus.can_request)"
          if old not in s:
              raise SystemExit('Legacy customer-only request guard not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/CustomerPortal.tsx
          git commit -m "Allow dual-mode accounts to continue customer requests"
          git push
